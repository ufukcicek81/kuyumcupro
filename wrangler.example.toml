name = "asil-kuyumcu-worker"
main = "worker.js"
compatibility_date = "2026-09-26"

# Cloudflare Dashboard -> Workers & Pages -> KV -> Create namespace
# Sonra binding adı NFC_SESSIONS olacak şekilde bağlayın.
[[kv_namespaces]]
binding = "NFC_SESSIONS"
id = "BURAYA_KV_NAMESPACE_ID"

[vars]
OPENSANCTIONS_THRESHOLD = "0.78"
# INVOICE_PROVIDER_URL = "https://entegrator-api-adresi/..."
# INVOICE_AUTH_HEADER = "Authorization"

# Aşağıdakileri TOML içine düz metin yazmayın; wrangler secret put ile girin:
# wrangler secret put OPENSANCTIONS_API_KEY
# wrangler secret put INVOICE_AUTH_VALUE
