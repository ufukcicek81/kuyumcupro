name: Fix customer label single name v6.69

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-customer-label-side-v668.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove duplicate customer name
        shell: python
        run: |
          from pathlib import Path

          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          duplicate='''        <div style="position:absolute;left:0.8mm;top:5.05mm;width:21.2mm;height:3.3mm;display:flex;align-items:center;justify-content:center;text-align:center;font-size:6.5pt;font-weight:900;line-height:1;white-space:nowrap;overflow:hidden;">${esc(name)}</div>
'''
          if duplicate not in s:
              raise SystemExit("duplicate customer name line not found")

          s=s.replace(duplicate,"",1)
          s=s.replace("Asil Kuyumcu Pro V6.68","Asil Kuyumcu Pro V6.69")
          s=s.replace("v6.68</span>","v6.69</span>")
          s=s.replace("state.meta.appVersion='6.68'","state.meta.appVersion='6.69'")

          p.write_text(s,encoding="utf-8")

          sw=Path("sw.js")
          sws=sw.read_text(encoding="utf-8")
          lines=sws.splitlines()
          if lines and lines[0].startswith("const C="):
              lines[0]="const C='asil-v6-69-customer-name-single-20260930';"
              sw.write_text("\n".join(lines)+"\n",encoding="utf-8")

      - name: Commit
        run: |
          git config user.name "ChatGPT Fix"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "v6.69: müşteri isim etiketinde çift yazıyı kaldır"
          git push
