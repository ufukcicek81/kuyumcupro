name: Deploy tested cari fix
on:
  push:
    branches: [main]
    paths:
      - cari-fix-final.js
      - .github/workflows/deploy-cari-fix.yml
permissions:
  contents: write
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test JavaScript
        run: node --check cari-fix-final.js
      - name: Test application structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=['cariCardGrid','Müşteri','Toptancı','Banka','Özel']
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('Cari UI test failed: missing '+', '.join(missing))
          print('Current application structure: PASS')
          PY
      - name: Install tested cari fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'Asil Kuyumcu Pro V6\.\d+', 'Asil Kuyumcu Pro V7.0', s)
          s=re.sub(r'(?<![A-Za-z0-9])V6\.\d+(?![A-Za-z0-9])', 'V7.0', s)
          s=re.sub(r'(?<![A-Za-z0-9])v6\.\d+(?![A-Za-z0-9])', 'v7.0', s)
          tag='<script src="./cari-fix-final.js"></script>'
          if tag not in s:
              pos=s.rfind('</body>')
              if pos<0:
                  raise SystemExit('Cannot find </body>')
              s=s[:pos]+tag+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'cari-fix-final.js' index.html
          grep -q 'V7.0' index.html
          node --check cari-fix-final.js
          git diff --check
      - name: Commit only after tests pass
        run: |
          git config user.name "Asil Kuyumcu CI"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "V7.0 cari filtre stabilizasyonu"
          git push origin HEAD:main
