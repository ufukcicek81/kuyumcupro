name: Deploy tested cari fix
on:
  push:
    branches: [main]
    paths:
      - cari-fix-final.js
permissions:
  contents: write
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # index.html artık eski bir commit'ten geri yüklenmiyor; aksi halde
      # index.html'de yapılan tüm düzeltmeler her çalıştırmada siliniyordu.
      - name: Test JavaScript
        run: node --check cari-fix-final.js
      - name: Test application structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=['cariCardGrid','Müşteri','Toptancı','Banka','Özel','stFx','modalConfirm']
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('Application structure test failed: missing '+', '.join(missing))
          print('Application structure: PASS')
          PY
      - name: Ensure cari fix script is included
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./cari-fix-final.js"></script>'
          if tag not in s:
              pos=s.rfind('</body>')
              if pos<0:
                  raise SystemExit('Cannot find </body>')
              s=s[:pos]+tag+s[pos:]
              p.write_text(s,encoding='utf-8')
          PY
          grep -q 'cari-fix-final.js' index.html
      - name: Commit only if index.html changed
        run: |
          git config user.name "Asil Kuyumcu CI"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "cari-fix-final.js script etiketini ekle"
          git push origin HEAD:main
