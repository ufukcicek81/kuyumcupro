name: Restore application files

on:
  push:
    paths:
      - .github/workflows/restore-files.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore stable application files
        run: |
          git config user.name "Asil Kuyumcu Restore"
          git config user.email "actions@users.noreply.github.com"
          git checkout e6275e72ac00c7128c45e82e9a2088a79aa7dd88 -- index.html cari-fix-final.js
          git add index.html cari-fix-final.js
          git commit -m "Restore stable application files"
          git push origin HEAD:main
