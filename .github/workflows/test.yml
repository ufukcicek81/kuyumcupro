name: Testler
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04 # ubuntu-latest (26.04) Playwright 1.56 ile tarayıcı kuramıyor
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bağımlılıklar
        run: npm ci
      - name: Sözdizimi kontrolü
        run: npm run check
      - name: Birim testleri (senkron birleştirme, şifreli yedek)
        run: npm test
      - name: Tarayıcı kurulumu
        run: npx playwright install --with-deps chromium
      - name: Uçtan uca testler
        run: npm run test:e2e
