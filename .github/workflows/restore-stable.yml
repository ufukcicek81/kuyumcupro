name: Restore stable application state

on:
  push:
    paths:
      - .github/workflows/restore-stable.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revert changes after stable version
        run: |
          git config user.name "Asil Kuyumcu Restore"
          git config user.email "actions@users.noreply.github.com"
          git revert --no-edit e6275e72ac00c7128c45e82e9a2088a79aa7dd88..HEAD
          git push origin HEAD:main
