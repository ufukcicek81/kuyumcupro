name: Final Cari Fix 2
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          sed -i 's/v6\.83/v6.94/g' index.html
          if ! grep -q 'cari-fix-final.js' index.html; then sed -i 's#</body>#<script src="cari-fix-final.js"></script></body>#' index.html; fi
      - name: Commit
        run: |
          git config user.name "ChatGPT Fix"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "v6.94 final cari fix"
          git push
