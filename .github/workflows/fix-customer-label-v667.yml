name: Fix customer label v6.67

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-customer-label-v667.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index directly
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          start = s.find("if(x.customerOnly){")
          end = s.find("const blocks=[];", start)
          if start < 0 or end < 0:
              raise SystemExit("customerOnly block not found")

          block = s[start:end]

          block = re.sub(
              r'left:23\.0mm;top:\.55mm;width:22\.7mm;height:3\.45mm;([^"]*?)font-size:\$\{msgPt\}pt;([^"]*?)letter-spacing:\.02em',
              r'left:23.2mm;top:.75mm;width:22.1mm;height:3.3mm;\1font-size:6.3pt;\2',
              block
          )
          block = re.sub(
              r'left:23\.0mm;top:5\.00mm;width:22\.7mm;height:2\.85mm;',
              r'left:23.2mm;top:5.15mm;width:22.1mm;height:2.7mm;',
              block
          )
          block = re.sub(
              r'left:(?:46\.0|0\.0)mm;top:\.55mm;width:(?:25\.4|22\.7)mm;height:3\.45mm;([^"]*?)font-size:\$\{namePt\}pt;([^"]*?)letter-spacing:\.01em',
              r'left:46.1mm;top:.65mm;width:24.4mm;height:3.3mm;\1font-size:6.5pt;\2',
              block
          )
          block = re.sub(
              r'left:(?:46\.0|0\.0)mm;top:5\.00mm;width:(?:25\.4|22\.7)mm;height:3\.45mm;([^"]*?)font-size:\$\{namePt\}pt;([^"]*?)letter-spacing:\.01em',
              r'left:46.1mm;top:5.05mm;width:24.4mm;height:3.3mm;\1font-size:6.5pt;\2',
              block
          )

          s = s[:start] + block + s[end:]

          forced = "const s={...printerSettings(),copies,mediaMode:'roll',labelWidthMm:72,labelHeightMm:10,gapMm:0,marginTopMm:0,marginRightMm:0,marginBottomMm:0,marginLeftMm:0,orientation:'portrait',horizontalOffsetMm:0,verticalOffsetMm:0,fontScale:100,showCode:false,showKarat:false,showSaleHas:false,showInternalCode:false};"
          normal = "const s={...printerSettings(),copies,showCode:false,showKarat:false,showSaleHas:false,showInternalCode:false};"
          if forced in s:
              s = s.replace(forced, normal, 1)

          s = s.replace("Asil Kuyumcu Pro V6.66", "Asil Kuyumcu Pro V6.67")
          s = s.replace("v6.66</span>", "v6.67</span>")
          s = s.replace("state.meta.appVersion='6.66'", "state.meta.appVersion='6.67'")
          s = s.replace("/* v6.66 — PC ekranlarında daha kompakt çalışma düzeni */", "/* v6.67 — PC ekranlarında daha kompakt çalışma düzeni */")

          p.write_text(s, encoding="utf-8")

      - name: Commit direct fix
        run: |
          git config user.name "ChatGPT Fix"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "v6.67: müşteri isim etiketini doğru tarafa geri al"
            git push
          fi
