name: Test cari fix
on:
  push:
    branches: [cari-fix-test]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax test
        run: node --check cari-fix-final.js
      - name: Application structure test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          required=['cariCardGrid','Cari Çağır','Müşteri','Toptancı','Banka','Özel']
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing required cari UI markers: '+', '.join(missing))
          print('Cari UI structure OK')
          PY
      - name: Install fix into stable app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Asil Kuyumcu Pro V6.86','Asil Kuyumcu Pro V6.87')
          s=s.replace('Asil Kuyumcu Pro V6.86','Asil Kuyumcu Pro V6.87')
          tag='<script src="./cari-fix-final.js"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check cari-fix-final.js
          grep -q 'cari-fix-final.js' index.html
          git diff --check
      - name: Commit tested build
        run: |
          git config user.name "Asil Kuyumcu Test"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "v6.87 cari filtreleri ve kompakt kartlar"
          git push origin HEAD:cari-fix-test
