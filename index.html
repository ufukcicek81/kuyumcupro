<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101113" />
  <meta name="description" content="Asil Kuyumcu Pro V4.0 - gelişmiş ürün kartı, stok, barkod, sayım, cari, kasa ve finans prototipi" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <title>Asil Kuyumcu Pro V4.0</title>
  <style>
:root {
  --bg: #0c0d0f;
  --panel: #14161a;
  --panel-2: #1a1d22;
  --panel-3: #20242a;
  --line: #2d323a;
  --text: #f4f5f7;
  --muted: #9ca3af;
  --gold: #d6b15f;
  --gold-2: #f0cf7d;
  --green: #36c98f;
  --red: #ff6b6b;
  --blue: #62a8ff;
  --orange: #ffad5a;
  --radius: 16px;
  --shadow: 0 18px 50px rgba(0,0,0,.28);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);min-height:100%;}
body{min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.muted{color:var(--muted)}
.positive{color:var(--green)}
.negative{color:var(--red)}
.gold{color:var(--gold-2)}

.login-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:
radial-gradient(circle at top right, rgba(214,177,95,.12), transparent 35%),
radial-gradient(circle at bottom left, rgba(98,168,255,.08), transparent 35%),var(--bg)}
.login-card{width:min(920px,100%);display:grid;grid-template-columns:1.15fr .85fr;background:var(--panel);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:var(--shadow)}
.login-hero{padding:56px;background:linear-gradient(150deg,#17191e,#0d0e10 72%);position:relative}
.brand-mark{width:64px;height:64px;border:1px solid rgba(214,177,95,.5);display:grid;place-items:center;border-radius:20px;color:var(--gold-2);font-weight:800;letter-spacing:.08em;margin-bottom:24px}
.login-hero h1{font-size:40px;line-height:1.05;margin:0 0 14px}
.login-hero p{color:#c5c8ce;line-height:1.6;max-width:520px}
.feature-pills{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}
.feature-pills span{border:1px solid #31363f;border-radius:99px;padding:9px 12px;color:#c7cbd2;background:#111317}
.login-form{padding:42px;display:flex;flex-direction:column;justify-content:center}
.login-form h2{margin:0 0 8px}
.login-form .sub{color:var(--muted);margin-bottom:26px}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:15px}
.field label{font-size:13px;color:#c7cbd2}
.input,.select,.textarea{width:100%;background:#0f1114;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 13px;outline:none}
.input:focus,.select:focus,.textarea:focus{border-color:#6f613e;box-shadow:0 0 0 3px rgba(214,177,95,.09)}
.btn{border:0;border-radius:12px;padding:12px 15px;background:var(--panel-3);color:var(--text);font-weight:650}
.btn:hover{filter:brightness(1.08)}
.btn-primary{background:linear-gradient(135deg,#d6b15f,#b99243);color:#101113}
.btn-danger{background:#3b1e22;color:#ffb7b7;border:1px solid #663038}
.btn-success{background:#173d31;color:#9bf0ce;border:1px solid #245d49}
.btn-outline{background:transparent;border:1px solid var(--line)}
.login-help{margin-top:16px;padding:12px;border:1px dashed #3a3e46;border-radius:12px;color:#aeb3bb;font-size:13px;line-height:1.5}

.app-shell{min-height:100vh;display:grid;grid-template-columns:258px minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;background:#0e1013;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;z-index:20}
.sidebar-brand{display:flex;align-items:center;gap:12px;padding:6px 8px 22px}
.sidebar-brand .logo{width:42px;height:42px;border-radius:13px;border:1px solid #5f5132;display:grid;place-items:center;color:var(--gold-2);font-weight:800}
.sidebar-brand strong{display:block;letter-spacing:.03em}.sidebar-brand small{color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:5px;overflow:auto;padding-right:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:#b9bec7;border-radius:12px;padding:11px 12px;text-align:left}
.nav button:hover,.nav button.active{background:#1b1e23;color:#fff}
.nav button.active{box-shadow:inset 3px 0 0 var(--gold)}
.nav .ico{width:22px;text-align:center;font-size:17px}
.sidebar-bottom{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--line)}
.user-chip{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#242831;color:var(--gold-2);font-weight:800}
.main{min-width:0}
.topbar{height:72px;position:sticky;top:0;z-index:15;background:rgba(12,13,15,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.topbar-left,.topbar-right{display:flex;align-items:center;gap:12px}
.mobile-menu{display:none}
.period-select{background:#171a1f;border:1px solid var(--line);color:#fff;padding:9px 11px;border-radius:10px}
.market-ticker{display:flex;align-items:center;gap:16px;font-size:13px;color:#b7bbc3}
.market-ticker strong{color:#fff;margin-left:5px}
.content{padding:24px;max-width:1600px;margin:0 auto}
.page-title{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}
.page-title h1{font-size:28px;margin:0 0 6px}.page-title p{margin:0;color:var(--muted)}

.grid{display:grid;gap:16px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid-6{grid-template-columns:repeat(6,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 10px 28px rgba(0,0,0,.12)}
.metric{min-height:128px;display:flex;flex-direction:column;justify-content:space-between}
.metric .label{color:var(--muted);font-size:13px}.metric .value{font-size:28px;font-weight:800;letter-spacing:-.02em}.metric .foot{font-size:12px;color:#7f8792}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.section-head h3{margin:0;font-size:17px}.section-head span{color:var(--muted);font-size:12px}

.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:11px 12px;border-bottom:1px solid #262b32;text-align:left;font-size:13px;white-space:nowrap}.table th{color:#aab0ba;background:#111318;position:sticky;top:0}.table tr:hover td{background:#171a1f}.table td.num,.table th.num{text-align:right}
.badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid #343941;background:#191c20}.badge.green{color:#9bf0ce;border-color:#275c49}.badge.red{color:#ffc1c1;border-color:#63323a}.badge.gold{color:#f1d58f;border-color:#625332}.badge.blue{color:#b8d7ff;border-color:#31557b}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.toolbar .input,.toolbar .select{width:auto;min-width:150px}.grow{flex:1}.search{min-width:240px!important}
.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.form-grid .span-2{grid-column:span 2}.form-grid .span-4{grid-column:1/-1}
.labelled{display:flex;flex-direction:column;gap:7px}.labelled label{font-size:12px;color:#aeb3bd}

.sale-layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(330px,.55fr);gap:16px}.sale-summary{position:sticky;top:90px;height:max-content}.summary-row{display:flex;justify-content:space-between;gap:20px;padding:9px 0;border-bottom:1px dashed #31353c}.summary-row.total{font-size:20px;font-weight:800;border:0;padding-top:14px}.payment-buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}.payment-buttons button{padding:11px}
.sale-line-editor{display:grid;grid-template-columns:1.1fr .65fr .55fr .7fr .8fr auto;gap:8px;align-items:end;margin-bottom:12px}
.empty-state{text-align:center;padding:46px 18px;color:#888f99}.empty-state strong{display:block;color:#dfe2e7;margin-bottom:6px}

.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}.tabs button{padding:10px 12px;background:transparent;color:#9ba1aa;border:0;border-bottom:2px solid transparent;white-space:nowrap}.tabs button.active{color:#fff;border-color:var(--gold)}
.price-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.price-card table{width:100%;border-collapse:collapse}.price-card th,.price-card td{padding:9px;border-bottom:1px solid #292e35;font-size:13px}.price-card input{width:100px;background:#101215;border:1px solid #31353c;border-radius:8px;color:#fff;padding:7px;text-align:right}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.68);display:grid;place-items:center;padding:16px;z-index:100}.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:#14171b;border:1px solid #353a42;border-radius:20px;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}.modal-head h3{margin:0}.modal-body{padding:20px}.modal-actions{display:flex;justify-content:flex-end;gap:10px;padding:16px 20px;border-top:1px solid var(--line)}

.toast{position:fixed;right:18px;bottom:18px;background:#1c2025;border:1px solid #3a4049;color:#fff;border-radius:13px;padding:12px 15px;box-shadow:var(--shadow);z-index:200;animation:toastin .2s ease}.toast.ok{border-color:#2f6c55}.toast.err{border-color:#7f3944}@keyframes toastin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

.mobile-overlay{display:none}
@media (max-width:1180px){.grid-6{grid-template-columns:repeat(3,1fr)}.grid-4{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:repeat(2,1fr)}.sale-layout{grid-template-columns:1fr}.sale-summary{position:static}.market-ticker{display:none}}
@media (max-width:820px){.app-shell{grid-template-columns:1fr}.sidebar{position:fixed;left:-280px;width:258px;transition:.22s;box-shadow:20px 0 50px rgba(0,0,0,.35)}.sidebar.open{left:0}.mobile-overlay.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:19}.mobile-menu{display:inline-flex}.topbar{padding:0 14px}.content{padding:16px}.grid-3,.grid-2{grid-template-columns:1fr}.grid-6{grid-template-columns:repeat(2,1fr)}.page-title{flex-direction:column}.form-grid{grid-template-columns:1fr}.form-grid .span-2,.form-grid .span-4{grid-column:auto}.sale-line-editor{grid-template-columns:1fr 1fr}.login-card{grid-template-columns:1fr}.login-hero{display:none}.login-form{padding:28px}.price-grid{grid-template-columns:1fr}.toolbar .input,.toolbar .select{width:100%}.toolbar>*{flex:1 1 180px}}
@media (max-width:520px){.grid-6,.grid-4{grid-template-columns:1fr}.metric{min-height:106px}.metric .value{font-size:24px}.topbar-right .user-label{display:none}.sale-line-editor{grid-template-columns:1fr}.payment-buttons{grid-template-columns:1fr}.content{padding:12px}.card{padding:14px;border-radius:14px}}


/* === V2 PC / TABLET EKRAN MODLARI === */
.mode-switch{display:flex;align-items:center;gap:4px;padding:4px;background:#111318;border:1px solid var(--line);border-radius:12px}
.mode-btn{border:0;background:transparent;color:#8f96a1;border-radius:9px;padding:7px 10px;font-size:12px;font-weight:750;white-space:nowrap}
.mode-btn.active{background:#2a251a;color:var(--gold-2);box-shadow:inset 0 0 0 1px #5e5030}
.login-mode-note{font-size:12px;color:var(--muted);margin-top:-4px;margin-bottom:12px}

body[data-ui-mode="pc"] .content{max-width:1700px}
body[data-ui-mode="pc"] .table th,body[data-ui-mode="pc"] .table td{padding-top:10px;padding-bottom:10px}

body[data-ui-mode="tablet"]{--radius:18px}
body[data-ui-mode="tablet"] .btn,body[data-ui-mode="tablet"] .input,body[data-ui-mode="tablet"] .select{min-height:44px}
body[data-ui-mode="tablet"] .content{padding:18px;max-width:1280px}
body[data-ui-mode="tablet"] .topbar{height:68px;padding:0 16px}
body[data-ui-mode="tablet"] .market-ticker{gap:10px;font-size:12px}
body[data-ui-mode="tablet"] .grid-6{grid-template-columns:repeat(3,minmax(0,1fr))}
body[data-ui-mode="tablet"] .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
body[data-ui-mode="tablet"] .grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}
body[data-ui-mode="tablet"] .form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
body[data-ui-mode="tablet"] .sale-layout{grid-template-columns:1fr}
body[data-ui-mode="tablet"] .sale-summary{position:static}
body[data-ui-mode="tablet"] .table{min-width:820px}
body[data-ui-mode="tablet"] .page-title h1{font-size:25px}
body[data-ui-mode="tablet"] .metric{min-height:118px}
body[data-ui-mode="tablet"] .metric .value{font-size:25px}
body[data-ui-mode="tablet"] .payment-buttons{grid-template-columns:repeat(3,1fr)}
body[data-ui-mode="tablet"] .toolbar{gap:8px}
body[data-ui-mode="tablet"] .toolbar .input,body[data-ui-mode="tablet"] .toolbar .select{min-width:170px}


/* Açık / Karanlık Tema */
.theme-switch{display:flex;align-items:center;gap:4px;padding:4px;background:#111318;border:1px solid var(--line);border-radius:12px}
.theme-btn{border:0;background:transparent;color:#9ca3af;padding:7px 9px;border-radius:8px;font-size:12px;font-weight:750;white-space:nowrap}
.theme-btn.active{background:#2a251a;color:var(--gold-2);box-shadow:inset 0 0 0 1px #5e5030}

body[data-theme="light"]{
  --bg:#f4f6f8;
  --panel:#ffffff;
  --panel-2:#f7f8fa;
  --panel-3:#eef1f4;
  --line:#d9dee5;
  --text:#18202a;
  --muted:#66717f;
  --gold:#b58a34;
  --gold-2:#9b7429;
  --green:#138a5c;
  --red:#d94c4c;
  --blue:#2f78d1;
  --orange:#c9791d;
  --shadow:0 18px 45px rgba(24,32,42,.12);
  background:var(--bg);
  color:var(--text);
}
body[data-theme="light"] .login-shell{background:radial-gradient(circle at top right,rgba(181,138,52,.12),transparent 35%),radial-gradient(circle at bottom left,rgba(47,120,209,.07),transparent 35%),var(--bg)}
body[data-theme="light"] .login-card,
body[data-theme="light"] .card,
body[data-theme="light"] .modal{background:var(--panel);border-color:var(--line);box-shadow:var(--shadow)}
body[data-theme="light"] .login-hero{background:linear-gradient(150deg,#fffaf0,#f3f5f7 72%)}
body[data-theme="light"] .login-hero p,
body[data-theme="light"] .field label{color:#5f6975}
body[data-theme="light"] .feature-pills span{border-color:#d8dde3;color:#4e5966;background:#f8f9fb}
body[data-theme="light"] .input,
body[data-theme="light"] .select,
body[data-theme="light"] .textarea,
body[data-theme="light"] .period-select{background:#fff;color:#18202a;border-color:var(--line)}
body[data-theme="light"] .input:focus,
body[data-theme="light"] .select:focus,
body[data-theme="light"] .textarea:focus{border-color:#b58a34;box-shadow:0 0 0 3px rgba(181,138,52,.12)}
body[data-theme="light"] .btn{background:#eef1f4;color:#18202a}
body[data-theme="light"] .btn-primary{background:linear-gradient(135deg,#d9b55f,#be943f);color:#17130b}
body[data-theme="light"] .btn-outline{background:#fff;border-color:#d7dce2;color:#26313d}
body[data-theme="light"] .btn-danger{background:#fff0f1;color:#b93644;border-color:#efc9ce}
body[data-theme="light"] .btn-success{background:#eaf8f1;color:#15704d;border-color:#bfe4d2}
body[data-theme="light"] .sidebar{background:#ffffff;border-color:var(--line)}
body[data-theme="light"] .sidebar-brand .logo{border-color:#c7a866;color:#9b7429}
body[data-theme="light"] .nav button{color:#52606e}
body[data-theme="light"] .nav button:hover,
body[data-theme="light"] .nav button.active{background:#f0f3f6;color:#17212b}
body[data-theme="light"] .sidebar-bottom{border-color:var(--line)}
body[data-theme="light"] .avatar{background:#eef1f4;color:#9b7429}
body[data-theme="light"] .topbar{background:rgba(255,255,255,.92);border-color:var(--line)}
body[data-theme="light"] .market-ticker{color:#687482}
body[data-theme="light"] .market-ticker strong{color:#18202a}
body[data-theme="light"] .mode-switch,
body[data-theme="light"] .theme-switch{background:#f2f4f7;border-color:#d9dee5}
body[data-theme="light"] .mode-btn,
body[data-theme="light"] .theme-btn{color:#5d6875}
body[data-theme="light"] .mode-btn.active,
body[data-theme="light"] .theme-btn.active{background:#fff4d9;color:#8d6720;box-shadow:inset 0 0 0 1px #dbc17e}
body[data-theme="light"] .metric .foot{color:#7b8794}
body[data-theme="light"] .table-wrap{border-color:var(--line)}
body[data-theme="light"] .table th,
body[data-theme="light"] .table td{border-color:#e3e7eb}
body[data-theme="light"] .table th{color:#5e6976;background:#f5f7f9}
body[data-theme="light"] .table tr:hover td{background:#f7f9fb}
body[data-theme="light"] .badge{border-color:#d8dde3;background:#f7f8fa}
body[data-theme="light"] .badge.green{color:#15704d;border-color:#b9dfce}
body[data-theme="light"] .badge.red{color:#b83c49;border-color:#e7bbc1}
body[data-theme="light"] .badge.gold{color:#8d6720;border-color:#d9c181}
body[data-theme="light"] .badge.blue{color:#2e69aa;border-color:#b7cce3}
body[data-theme="light"] .summary-row{border-color:#d9dee5}
body[data-theme="light"] .tabs{border-color:var(--line)}
body[data-theme="light"] .tabs button{color:#6d7885}
body[data-theme="light"] .tabs button.active{color:#17212b}
body[data-theme="light"] .price-card th,
body[data-theme="light"] .price-card td{border-color:#e1e5e9}
body[data-theme="light"] .price-card input{background:#fff;border-color:#d6dbe1;color:#17212b}
body[data-theme="light"] .modal-backdrop{background:rgba(32,38,46,.38)}
body[data-theme="light"] .toast{background:#ffffff;border-color:#d7dce2;color:#17212b}
body[data-theme="light"] .empty-state{color:#778391}
body[data-theme="light"] .empty-state strong{color:#27323e}
body[data-theme="light"] .login-help{border-color:#d8dde3;color:#5f6975}

@media (min-width:650px){
  body[data-ui-mode="tablet"] .app-shell{grid-template-columns:92px minmax(0,1fr)}
  body[data-ui-mode="tablet"] .sidebar{position:sticky;left:auto;width:auto;height:100vh;padding:14px 8px;box-shadow:none}
  body[data-ui-mode="tablet"] .sidebar-brand{justify-content:center;padding:4px 0 14px}
  body[data-ui-mode="tablet"] .sidebar-brand>div:last-child{display:none}
  body[data-ui-mode="tablet"] .sidebar-brand .logo{width:48px;height:48px;border-radius:15px}
  body[data-ui-mode="tablet"] .nav{gap:7px}
  body[data-ui-mode="tablet"] .nav button{min-height:64px;flex-direction:column;justify-content:center;gap:4px;padding:7px 4px;text-align:center;font-size:10px;line-height:1.1}
  body[data-ui-mode="tablet"] .nav button.active{box-shadow:inset 3px 0 0 var(--gold)}
  body[data-ui-mode="tablet"] .nav .ico{font-size:21px;width:auto}
  body[data-ui-mode="tablet"] .sidebar-bottom{padding:10px 2px 0}
  body[data-ui-mode="tablet"] .user-chip{justify-content:center}
  body[data-ui-mode="tablet"] .user-chip>div:last-child{display:none}
  body[data-ui-mode="tablet"] .avatar{width:42px;height:42px}
  body[data-ui-mode="tablet"] #logoutBtn{font-size:11px;padding:8px 4px;min-height:38px}
  body[data-ui-mode="tablet"] .mobile-menu{display:none!important}
  body[data-ui-mode="tablet"] .mobile-overlay{display:none!important}
}

@media (max-width:980px){
  body[data-ui-mode="tablet"] .market-ticker{display:none}
  body[data-ui-mode="tablet"] .topbar-right .user-label,body[data-ui-mode="tablet"] .topbar-right .badge{display:none}
  body[data-ui-mode="tablet"] .grid-6{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
  .mode-switch{display:none}
  .theme-switch{padding:3px}
  .theme-btn{font-size:0;padding:7px;min-width:32px}
  .theme-btn::first-letter{font-size:14px}
  body[data-ui-mode="tablet"] .app-shell{grid-template-columns:1fr}

    return {kind,id,account,name};
  }

  function marketNum(){
    for(const v of arguments){
      if(v===null || v===undefined || v==='') continue;
      if(typeof v==='number' && Number.isFinite(v)) return v;
      let t=String(v).trim().replace(/\s/g,'');
      if(t.includes(',') && t.includes('.')) t=t.replace(/\./g,'').replace(',','.');
      else if(t.includes(',')) t=t.replace(',','.');
      const n=Number(t); if(Number.isFinite(n)) return n;
    }
    return 0;
  }
  function nestedMarketValue(obj, keys){
    for(const key of keys){
      const parts=key.split('.'); let cur=obj;
      for(const part of parts){ if(cur && Object.prototype.hasOwnProperty.call(cur,part)) cur=cur[part]; else {cur=undefined;break;} }
      const n=marketNum(cur); if(n) return n;
    }
    return 0;
  }
  function remoteAdjustment(key, fallback=0){
    const v=remoteAsilPriceSettings && remoteAsilPriceSettings[key];
    const n=Number(v); return Number.isFinite(n)?n:fallback;
  }
  function remoteFxAdjustment(id, side){
    const d=remoteAsilPriceSettings?.dovizDuz || {};
    const n=Number(d[id+(side==='buy'?'A':'S')]); return Number.isFinite(n)?n:0;
  }
  function remoteProductMultiplier(code, side){
    const map={CEYREK:'ceyrek',YARIM:'yarim',ZIYNET:'tam',ATA:'ata',RESAT:'resat','22B':'ayar22','24G1':'has24'};
    if(code==='22H' || code==='14H'){
      const hk=code==='22H'?'hurda22':'hurda14'; const h=remoteAsilPriceSettings?.hurdaCarp || {};
      const n=Number(h[hk+(side==='buy'?'A':'S')]); if(Number.isFinite(n)&&n>0)return n;
    }
    const rk=map[code]; if(rk){
      const labor=(remoteAsilPriceSettings?.aktifMod==='hareketli' && remoteAsilPriceSettings?.laborH?.[rk]) || remoteAsilPriceSettings?.labor?.[rk];
      const n=Number(labor?.[side==='buy'?'a':'s']); if(Number.isFinite(n)&&n>0)return n;
    }
    if(code==='22G1') return side==='buy'?0.916:0.960;
    return 0;
  }
  function recalcGoldItemsFromHas(){
    const hb=Number(state.prices.has.buy||0), hs=Number(state.prices.has.sell||0); if(!hb||!hs)return;
    state.prices.gold22 = state.prices.gold22 || {buy:0,sell:0};
    state.prices.gold22.buy = hb*0.916; state.prices.gold22.sell = hs*0.916;
    (state.prices.items||[]).forEach(item=>{
      let bm=remoteProductMultiplier(item.code,'buy'); let sm=remoteProductMultiplier(item.code,'sell');
      if(!bm) bm=Number(item.buyMilyem||0)/1000; if(!sm) sm=Number(item.sellMilyem||0)/1000;
      if(bm>0) item.buy=Number((hb*bm).toFixed(2));
      if(sm>0) item.sell=Number((hs*sm).toFixed(2));
    });
  }

  async function loadAsilRemotePriceSettings(){
    try{
      const r=await fetch(ASIL_PRICE_SETTINGS_URL+'?v='+Date.now(),{cache:'no-store'}); if(!r.ok)throw new Error('Firebase '+r.status);
      const data=await r.json(); if(data&&typeof data==='object')remoteAsilPriceSettings=data;
    }catch(e){ /* Fiyat akışını kesme; mevcut düzeltmeler olmadan worker verisi kullanılabilir. */ }
  }
  async function fetchFallbackFx(){
    try{
      const r=await fetch('https://api.exchangerate-api.com/v4/latest/USD',{cache:'no-store'}); if(!r.ok)return;
      const d=await r.json(), rates=d?.rates||{}, usd=Number(rates.TRY||0); if(!usd)return;
      const pairs={usd:{buy:usd,sell:usd},eur:{buy:usd/Number(rates.EUR||1),sell:usd/Number(rates.EUR||1)},gbp:{buy:usd/Number(rates.GBP||1),sell:usd/Number(rates.GBP||1)},chf:{buy:usd/Number(rates.CHF||1),sell:usd/Number(rates.CHF||1)}};
      Object.entries(pairs).forEach(([id,v])=>{if(!state.prices[id]?.buy){state.prices[id]={buy:v.buy,sell:v.sell};}});
    }catch(e){}
  }
  async function fetchLiveMarketPrices(force=false){
    if((state.settings.livePriceSync===false&&!force)||livePriceBusy)return; livePriceBusy=true;
    try{
      const worker=state.settings.livePriceWorkerUrl||LIVE_PRICE_WORKER_URL;
      const r=await fetch(worker+'?v='+Date.now(),{cache:'no-store'}); if(!r.ok)throw new Error('Worker '+r.status);
      const data=await r.json();
      const rawHasBuy=nestedMarketValue(data,['hasAlis','has.alis','HAS.alis','data.hasAlis']);
      const rawHasSell=nestedMarketValue(data,['hasSatis','has.satis','HAS.satis','data.hasSatis']);
      if(!rawHasBuy||!rawHasSell)throw new Error('HAS fiyatı bulunamadı');
      state.prices.has.buy=rawHasBuy+remoteAdjustment('hasDuzA'); state.prices.has.sell=rawHasSell+remoteAdjustment('hasDuzS');
      const fxMap={usd:['usdAlis','usdSatis'],eur:['eurAlis','eurSatis'],gbp:['gbpAlis','gbpSatis'],chf:['chfAlis','chfSatis']};
      Object.entries(fxMap).forEach(([id,keys])=>{
        const b=nestedMarketValue(data,[keys[0],id+'.alis',id.toUpperCase()+'.alis','data.'+keys[0]]);
        const sl=nestedMarketValue(data,[keys[1],id+'.satis',id.toUpperCase()+'.satis','data.'+keys[1]]);
        if(b||sl){state.prices[id]=state.prices[id]||{buy:0,sell:0}; if(b)state.prices[id].buy=b+remoteFxAdjustment(id,'buy'); if(sl)state.prices[id].sell=sl+remoteFxAdjustment(id,'sell');}
      });
      recalcGoldItemsFromHas();
      state.market.status='live'; state.market.lastUpdated=now(); state.market.lastError=''; state.market.source='Asil Kuyumcu / Cloudflare Worker';
      save(); updateMarketTickerDom();
      if(!state.prices.usd.buy||!state.prices.eur.buy) await fetchFallbackFx();
    }catch(e){
      state.market.status='offline'; state.market.lastError=String(e?.message||e); updateMarketTickerDom();
    }finally{livePriceBusy=false;}
  }
  function initLivePriceSync(){
    loadAsilRemotePriceSettings().then(()=>fetchLiveMarketPrices());
    clearInterval(livePriceTimer); clearInterval(asilSettingsTimer);
    livePriceTimer=setInterval(()=>fetchLiveMarketPrices(),LIVE_PRICE_INTERVAL_MS);
    asilSettingsTimer=setInterval(()=>loadAsilRemotePriceSettings(),60000);
    updateMarketTickerDom();
  }

  function currencyTlRate(currency, side='buy'){
    const c=String(currency||'TL').toUpperCase();
    if(c==='TL')return 1;
    if(c==='HAS')return Number(state.prices.has?.[side]||state.prices.has?.buy||1);
    const key=c.toLowerCase();
    return Number(state.prices[key]?.[side]||state.prices[key]?.buy||1);
  }
  function financeTlValue(x){
    if(Number.isFinite(Number(x.tlAmount))) return Number(x.tlAmount);
    const cur=String(x.accountCurrency||'TL').toUpperCase();
    if(cur==='TL') return Number(x.amount||x.accountAmount||0);
    return Number(x.accountAmount||0)*currencyTlRate(cur,'buy');
  }
  function financeMoveGroup(x){
    if(x.tradeType) return x.tradeType;
    if(x.sourceCategory) return x.sourceCategory;
    const doc=String(x.sourceDocNo||'');
    if(doc.startsWith('SAT-')) return 'Normal Satış';
    if(doc.startsWith('ALS-')) return 'Altın Giriş / Alış';
    const t=String(x.type||'');
    if(/tahsilat|ödeme|masraf|gelir/i.test(t)) return 'Tahsilat / Ödeme';
    return 'Diğer';
  }

  function uniqueValues(arr){ return [...new Set(arr.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'tr')); }
  function purityFactor(purity){ return Number(purity||0)/1000; }
  function calcHas(net,purity){ return Number((Number(net||0)*purityFactor(purity)).toFixed(4)); }
  function eanCheckDigit(first12){
    const d=String(first12).replace(/\D/g,'').padStart(12,'0').slice(-12).split('').map(Number);
    const sum=d.reduce((a,n,i)=>a+n*(i%2===0?1:3),0); return (10-(sum%10))%10;
  }
  function generateBarcode(seed=''){
    const digits=(String(Date.now())+String(Math.floor(Math.random()*1000000))).replace(/\D/g,'');
    let first12=('869'+digits).slice(0,12); if(first12.length<12) first12=first12.padEnd(12,'0');
    return first12+eanCheckDigit(first12);
  }
  function normalizeEan(code){
    let d=String(code||'').replace(/\D/g,''); if(!d) return generateBarcode();
    if(d.length<12) d=d.padStart(12,'0'); if(d.length>13) d=d.slice(-13);
    if(d.length===12) d+=eanCheckDigit(d); return d;
  }
  function eanSvg(code){
    const c=normalizeEan(code); if(c.length!==13) return '';
    const L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
    const G=['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
    const R=['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
    const P=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
    let bits='101', parity=P[Number(c[0])];
    for(let i=1;i<=6;i++) bits += (parity[i-1]==='L'?L:G)[Number(c[i])];
    bits+='01010'; for(let i=7;i<=12;i++) bits+=R[Number(c[i])]; bits+='101';
    const w=bits.length, bars=[...bits].map((b,i)=>b==='1'?`<rect x="${i}" y="0" width="1" height="42"/>`:'').join('');
    return `<svg viewBox="0 0 ${w} 54" preserveAspectRatio="none" aria-label="EAN13 ${c}"><g fill="#000">${bars}</g><text x="${w/2}" y="53" text-anchor="middle" font-size="9" font-family="monospace">${c}</text></svg>`;
  }

  function bindPage(r){
    document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{route=b.dataset.go;render();}));
    if(r==='dashboard'){
      const q=document.getElementById('quickSale'); if(q) q.addEventListener('click',()=>{route='sales';render();});
    }
    if(r==='sales') bindSales();
    if(r==='purchases') bindPurchases();
    if(r==='stocks') bindStocks();
    if(r==='customers') bindCustomers();
    if(r==='finance') bindFinance();
    if(r==='scrap') bindScrap();
    if(r==='prices') bindPrices();
    if(r==='count') bindCount();
    if(r==='parameters') bindParameters();
    if(r==='definitions') bindDefinitions();
    if(r==='reports') bindReports();
    if(r==='backup') bindBackup();
  }

  function openSpecialTrade(tradeType){
    const side=tradeType.endsWith('Alış')?'Alış':'Satış';
    const isZiynet=tradeType.startsWith('Ziynet');
    const isHurda=tradeType.startsWith('Hurda');
    const isFx=tradeType.startsWith('Döviz');
    const tlAccounts=accountOptions('TL',side==='Satış');
    if(isFx){
      if(!tlAccounts.length)return toast('TL kasa/banka hesabı tanımlayın','err');

    else if(unit==='HAS') c.hasBalance=Number(c.hasBalance||0)+delta;
    else { c.otherBalances=c.otherBalances||{}; c.otherBalances[unit]=Number(c.otherBalances[unit]||0)+delta; }
  }

    const sale=state.sales.find(x=>x.id===saleId); if(!sale)return {ok:false,msg:'Bağlı satış belgesi bulunamadı'};
    const cms=state.customerMoves.filter(m=>m.sourceType==='sale' && (m.sourceId===sale.id || m.sourceDocNo===sale.docNo));
    cms.forEach(m=>{const c=state.customers.find(x=>x.id===m.customerId);if(c)applyCariBalance(c,m.unit,Number(m.credit||0),Number(m.debit||0));});
    state.customerMoves=state.customerMoves.filter(m=>!(m.sourceType==='sale' && (m.sourceId===sale.id || m.sourceDocNo===sale.docNo)));
    state.financeMoves.filter(f=>f.sourceDocNo===sale.docNo).forEach(reverseFinanceMove); state.financeMoves=state.financeMoves.filter(f=>f.sourceDocNo!==sale.docNo);
    const ids=new Set((sale.lines||[]).map(l=>l.stockId)); state.stocks.forEach(st=>{if(ids.has(st.id)){st.status='Stokta';st.saleTo='';st.saleDate='';}});
    state.stockMoves=state.stockMoves.filter(m=>!(ids.has(m.stockId) && m.type==='SATIŞ' && String(m.description||'').includes(sale.docNo||'')));
    state.sales=state.sales.filter(x=>x.id!==sale.id); audit(`${sale.docNo||sale.id} satış belgesi cari merkezinden silindi ve stok/finans geri alındı`,'Satış'); return {ok:true};
  }
  function cancelPurchaseById(purchaseId){
    const pur=state.purchases.find(x=>x.id===purchaseId); if(!pur)return {ok:false,msg:'Bağlı altın giriş belgesi bulunamadı'};
    const ids=new Set((pur.stockIds||[])); const related=state.stocks.filter(st=>ids.has(st.id)||st.purchaseDocNo===pur.docNo); related.forEach(st=>ids.add(st.id));
    if(related.some(st=>st.status==='Satıldı'||st.saleDate)) return {ok:false,msg:'Bu altın girişindeki ürünlerden satılmış olan var. Önce ilgili satış hareketini silin.'};
    const cms=state.customerMoves.filter(m=>m.sourceType==='purchase' && (m.sourceId===pur.id || m.sourceDocNo===pur.docNo));
    cms.forEach(m=>{const c=state.customers.find(x=>x.id===m.customerId);if(c)applyCariBalance(c,m.unit,Number(m.credit||0),Number(m.debit||0));});
    state.customerMoves=state.customerMoves.filter(m=>!(m.sourceType==='purchase' && (m.sourceId===pur.id || m.sourceDocNo===pur.docNo)));
    state.financeMoves.filter(f=>f.sourceDocNo===pur.docNo).forEach(reverseFinanceMove); state.financeMoves=state.financeMoves.filter(f=>f.sourceDocNo!==pur.docNo);
    state.stockMoves=state.stockMoves.filter(m=>!ids.has(m.stockId)); state.stocks=state.stocks.filter(st=>!ids.has(st.id)); state.purchases=state.purchases.filter(x=>x.id!==pur.id);
    audit(`${pur.docNo||pur.id} altın giriş belgesi cari merkezinden silindi ve stok/finans geri alındı`,'Alış'); return {ok:true};
  }
  function deleteAnyCariMove(moveId){
    const m=state.customerMoves.find(x=>x.id===moveId); if(!m)return; const c=state.customers.find(x=>x.id===m.customerId);
    const linked=m.sourceType==='sale'?'satış belgesi':m.sourceType==='purchase'?'altın giriş belgesi':'';
    const warning=linked?`<div class="notice"><strong>Bağlı işlem:</strong> Bu cari satırı bir ${linked}ne bağlıdır. Silme işlemi kaynak belgeyi ve ona bağlı stok/finans hareketlerini de geri alacaktır.</div>`:`<div class="notice">Bu manuel cari hareketi silinince bakiye otomatik geri alınacaktır.</div>`;
    modal('Cari Hareketi Sil',`${warning}<div class="summary-row"><span>Cari</span><strong>${esc(c?.name||'-')}</strong></div><div class="summary-row"><span>İşlem</span><strong>${esc(m.type)}</strong></div><div class="summary-row"><span>Belge</span><strong>${esc(m.sourceDocNo||'-')}</strong></div><div class="summary-row"><span>Borç / Alacak</span><strong>${qty(m.debit)} / ${qty(m.credit)} ${esc(m.unit)}</strong></div>`,()=>{
      let r={ok:true}; if(m.sourceType==='sale')r=cancelSaleById(m.sourceId); else if(m.sourceType==='purchase')r=cancelPurchaseById(m.sourceId); else removeManualCariMove(moveId);
      if(!r.ok)return toast(r.msg,'err'); closeModal(); save(); render(); toast(linked?'Bağlı belge ve cari hareketi silindi':'Cari hareketi silindi');
    },'SİL');
  }
  function deleteCariMove(customerId, moveId){ deleteAnyCariMove(moveId); }
  function openCariDetail(id){
    const c=state.customers.find(x=>x.id===id); if(!c)return;
    const rows=state.customerMoves.filter(x=>x.customerId===id).sort((a,b)=>b.date.localeCompare(a.date));
    modal(`Ekstre — ${c.name}`,`${rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Tarih</th><th>İşlem</th><th>Birim</th><th class="num">Borç</th><th class="num">Alacak</th><th>Belge</th><th>Açıklama</th><th>İşlem</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${trDate(x.date)}</td><td>${esc(x.type)}</td><td>${esc(x.unit)}</td><td class="num">${qty(x.debit)}</td><td class="num">${qty(x.credit)}</td><td>${esc(x.sourceDocNo||'-')}</td><td>${esc(x.description)}</td><td><button class="btn btn-danger cari-delete" data-cari-delete="${x.id}">Sil</button></td></tr>`).join('')}</tbody></table></div><div class="notice" style="margin-top:12px">Bu ekrandaki tüm cari hareketlerde <b>Sil</b> kullanılabilir. Bağlı SAT / AG hareketlerinde kaynak belge de güvenli şekilde geri alınır.</div>`:'<div class="empty-state"><strong>Hareket yok</strong></div>'}`,null,'Kapat');
    document.querySelectorAll('[data-cari-delete]').forEach(b=>b.addEventListener('click',()=>deleteAnyCariMove(b.dataset.cariDelete)));
  }



  function bindFinance(){
    document.getElementById('financeFilter')?.addEventListener('change',e=>{financeFilter=e.target.value;render();});
    document.getElementById('financeFilterClear')?.addEventListener('click',()=>{financeFilter='Tümü';render();});
    const openMove=(direction)=>{
      const accountRows=[...state.cashAccounts.map(x=>({kind:'Kasa',id:x.id,name:x.name,currency:x.currency})),...state.bankAccounts.map(x=>({kind:'Banka',id:x.id,name:`${x.bank} / ${x.name}`,currency:x.currency})),...state.posAccounts.map(x=>({kind:'POS',id:x.id,name:x.name,currency:'TL'}))];
      modal(direction==='Giriş'?'Yeni Tahsilat':'Yeni Ödeme',`<div class="form-grid"><div class="labelled"><label>İşlem Türü</label><select id="fmType" class="select">${(direction==='Giriş'?['Nakit Tahsilat','Havale / EFT Tahsilat','Kredi Kartı Tahsilat','Cari Tahsilat','Gelir']:['Nakit Ödeme','Havale / EFT Ödeme','Cari Ödeme','Masraf']).map(x=>`<option>${x}</option>`).join('')}</select></div><div class="labelled span-2"><label>Hesap</label><select id="fmAccount" class="select">${accountRows.map(x=>`<option value="${x.kind}:${x.id}">${x.kind} — ${esc(x.name)} (${esc(x.currency)})</option>`).join('')}</select></div><div class="labelled"><label>Hesap Tutarı</label><input id="fmAmount" type="number" step="0.01" class="input"></div><div class="labelled span-2"><label>Cari / Kaynak</label><input id="fmCustomer" class="input" placeholder="Müşteri, firma veya açıklama"></div><div class="labelled span-2"><label>Açıklama</label><input id="fmDesc" class="input"></div></div>`,()=>{
        const amount=Number(document.getElementById('fmAmount').value||0); if(amount<=0)return toast('Tutar girin','err'); const key=document.getElementById('fmAccount').value,a=accountByKey(key); if(!a.account)return toast('Hesap bulunamadı','err'); const cur=String(a.account.currency||'TL'),tlAmount=amount*currencyTlRate(cur,'buy'); a.account.balance=Number(a.account.balance||0)+(direction==='Giriş'?amount:-amount); const rec={id:uid('FIN'),period:state.activePeriod,date:now(),direction,type:document.getElementById('fmType').value,accountKind:a.kind,accountId:a.id,accountName:a.name,amount:tlAmount,accountAmount:amount,accountCurrency:cur,tlAmount,customer:document.getElementById('fmCustomer').value,description:document.getElementById('fmDesc').value,user:session.name,sourceCategory:'Tahsilat / Ödeme'}; state.financeMoves.unshift(rec); audit(`${direction} ${qty(amount)} ${cur} — ${rec.type}`,'Kasa/Finans');closeModal();save();render();
      },direction==='Giriş'?'Tahsilatı Kaydet':'Ödemeyi Kaydet');
    };
    document.getElementById('newCollection')?.addEventListener('click',()=>openMove('Giriş')); document.getElementById('newPayment')?.addEventListener('click',()=>openMove('Çıkış'));
  }

  function bindDefinitions(){
    document.querySelectorAll('[data-open-stockcards]').forEach(b=>b.addEventListener('click',()=>{route='stocks';stockView='cards';render();}));
    document.querySelectorAll('[data-def]').forEach(btn=>btn.addEventListener('click',()=>openDefinitionModal(btn.dataset.def)));
  }
  function openDefinitionModal(key){
    const title=definitionCatalog.find(x=>x[0]===key)?.[1]||'Tanımlama'; const items=state.definitions[key]||[];
    modal(title,`${items.length?`<div class="table-wrap" style="margin-bottom:14px"><table class="table" style="min-width:0"><thead><tr><th>Kayıt</th><th style="width:90px">İşlem</th></tr></thead><tbody>${items.map((x,i)=>`<tr><td>${esc(x)}</td><td><button class="btn btn-danger" data-def-del="${i}">Sil</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-state"><strong>Kayıt yok</strong>İlk tanımı aşağıdan ekleyin.</div>'}<div class="field"><label>Yeni Kayıt</label><input id="defNewValue" class="input" placeholder="Tanım adını yazın"></div>`,()=>{const value=document.getElementById('defNewValue').value.trim(); if(!value)return toast('Tanım adını girin','err');if(items.includes(value))return toast('Bu kayıt zaten var','err');items.push(value);audit(`${title}: ${value} eklendi`,'Tanımlamalar');closeModal();save();render();},'Ekle');
    document.querySelectorAll('[data-def-del]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.defDel);const removed=items.splice(i,1)[0];audit(`${title}: ${removed} silindi`,'Tanımlamalar');save();openDefinitionModal(key);}));
  }

  function bindScrap(){document.getElementById('newScrap').addEventListener('click',()=>modal('Yeni Hurda / Ziynet Alışı',`<div class="form-grid"><div class="labelled"><label>Tür</label><select id="hsKind" class="select"><option>Hurda</option><option>Ziynet</option></select></div><div class="labelled"><label>Ayar / Ürün</label><select id="hsKarat" class="select"><option>14 Ayar</option><option>22 Ayar</option><option>24 Ayar</option><option>Çeyrek</option><option>Yarım</option><option>Ziynet Lira</option></select></div><div class="labelled"><label>Gram / Adet</label><input id="hsGram" type="number" step="0.001" class="input"></div><div class="labelled"><label>Birim Fiyat</label><input id="hsPrice" type="number" step="0.01" class="input" value="${state.prices.items.find(x=>x.code==='14H')?.buy||0}"></div><div class="labelled span-2"><label>Müşteri / Açıklama</label><input id="hsCustomer" class="input" value="Peşin Müşteri"></div><div class="labelled"><label>Ödeme</label><select id="hsPay" class="select"><option>Nakit</option><option>Havale</option><option>Cari</option><option>HAS</option></select></div></div>`,()=>{const gram=Number(document.getElementById('hsGram').value||0),unit=Number(document.getElementById('hsPrice').value||0);if(gram<=0||unit<=0)return toast('Gram/adet ve fiyat girin','err');const rec={id:uid('H'),period:state.activePeriod,date:now(),kind:document.getElementById('hsKind').value,customer:document.getElementById('hsCustomer').value,karat:document.getElementById('hsKarat').value,gram,unitPrice:unit,total:gram*unit,payment:document.getElementById('hsPay').value,user:session.name};state.scrap.unshift(rec);audit(`${rec.kind} ${qty(gram)} / ${money(rec.total)} alış kaydı`,'Hurda/Ziynet');closeModal();save();render();}));}

  function bindPrices(){
    document.getElementById('savePrices').addEventListener('click',()=>{document.querySelectorAll('[data-price]').forEach(i=>{const [k,f]=i.dataset.price.split('.');state.prices[k][f]=Number(i.value||0)});document.querySelectorAll('[data-item]').forEach(i=>{const [idx,f]=i.dataset.item.split('.');state.prices.items[Number(idx)][f]=Number(i.value||0)});audit('Kur ve altın fiyatları güncellendi','Fiyat');save();toast(state.settings.livePriceSync===false?'Manuel fiyatlar kaydedildi':'Fiyatlar kaydedildi; canlı sistem bir sonraki güncellemede HAS/dövizi yeniler');render();});
    document.getElementById('refreshLivePrices')?.addEventListener('click',async()=>{await loadAsilRemotePriceSettings();await fetchLiveMarketPrices(true);toast(state.market.status==='live'?'Canlı fiyatlar güncellendi':'Canlı fiyat bağlantısı kurulamadı',state.market.status==='live'?'ok':'err');updateMarketTickerDom();});
    document.getElementById('toggleLivePrices')?.addEventListener('click',()=>{state.settings.livePriceSync=state.settings.livePriceSync===false?true:false;save();if(state.settings.livePriceSync)fetchLiveMarketPrices(true);render();});
  }

  function bindCount(){
    document.getElementById('startCount')?.addEventListener('click',()=>{if(currentCountSession())return toast('Aktif sayım zaten var','err');const ids=state.stocks.filter(x=>x.period===state.activePeriod&&x.status==='Stokta').map(x=>x.id);state.countSessions.unshift({id:uid('COUNT'),period:state.activePeriod,date:now(),status:'Aktif',mode:'Barkod',expectedIds:ids,countedIds:[],extraCodes:[],scanLog:[],lastMessage:'Sayım başlatıldı',user:session.name});audit(`Sayım başlatıldı: ${ids.length} ürün`,'Sayım');save();render();});
    const run=()=>{const cs=currentCountSession();if(!cs)return;const inp=document.getElementById('countBarcode'),v=inp.value.trim();if(!v)return;cs.mode=document.getElementById('countMode').value;const st=state.stocks.find(x=>x.period===state.activePeriod&&(x.barcode===v||x.rfid===v||x.code===v));if(!st||!cs.expectedIds.includes(st.id)){cs.extraCodes.push(v);cs.scanLog.push({code:v,stockId:'',date:now(),result:'Eşleşmeyen'});cs.lastMessage=`Eşleşmeyen kod: ${v}`;toast('Stokta eşleşen ürün yok','err');}else if(cs.countedIds.includes(st.id)){cs.scanLog.push({code:v,stockId:st.id,date:now(),result:'Tekrar'});cs.lastMessage=`Tekrar okutuldu: ${st.code}`;toast('Bu ürün daha önce sayıldı','err');}else{cs.countedIds.push(st.id);cs.scanLog.push({code:v,stockId:st.id,date:now(),result:'Sayıldı'});cs.lastMessage=`Sayıldı: ${st.code} · ${st.name}`;addStockMove(st,'SAYIM','','',`Sayım ${cs.id}`);}save();render();setTimeout(()=>document.getElementById('countBarcode')?.focus(),30);};
    document.getElementById('countFind')?.addEventListener('click',run);document.getElementById('countBarcode')?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();run();}});
    document.getElementById('countUndo')?.addEventListener('click',()=>{const cs=currentCountSession();if(!cs||!cs.scanLog.length)return toast('Geri alınacak okutma yok','err');const last=cs.scanLog.pop();if(last.result==='Sayıldı')cs.countedIds=cs.countedIds.filter(x=>x!==last.stockId);if(last.result==='Eşleşmeyen'){const i=cs.extraCodes.lastIndexOf(last.code);if(i>=0)cs.extraCodes.splice(i,1);}cs.lastMessage='Son okutma geri alındı';save();render();});
    document.getElementById('finishCount')?.addEventListener('click',()=>{const cs=currentCountSession();if(!cs)return;cs.status='Tamamlandı';cs.finishedAt=now();cs.lastMessage='Sayım tamamlandı';audit(`Sayım tamamlandı: ${cs.countedIds.length}/${cs.expectedIds.length}, eşleşmeyen ${cs.extraCodes.length}`,'Sayım');save();render();});
  }

  function bindParameters(){
    document.querySelectorAll('[data-param-filter]').forEach(b=>b.addEventListener('click',()=>{const g=b.dataset.paramFilter||'';document.querySelectorAll('[data-param-filter]').forEach(x=>x.classList.toggle('btn-primary',x===b));document.querySelectorAll('[data-param-row]').forEach(r=>r.style.display=!g||r.dataset.paramGroup===g?'':'none');}));
    document.getElementById('saveSystemParameters')?.addEventListener('click',()=>{
      document.querySelectorAll('.param-value').forEach(el=>{const i=Number(el.dataset.paramIndex);if(state.systemParameters[i])state.systemParameters[i].value=el.value;});
      const user=state.users.find(x=>x.id===session?.id)||state.users[0]; user.permissions=user.permissions||{};user.permissions.canSell=document.getElementById('permSell')?.checked!==false;user.permissions.canChangePrice=Boolean(document.getElementById('permPrice')?.checked);user.permissions.canViewCost=Boolean(document.getElementById('permCost')?.checked);user.permissions.canManageFinance=Boolean(document.getElementById('permFinance')?.checked);
      const auto=state.systemParameters.find(x=>x.key==='autoGoldPrice'); if(auto)state.settings.livePriceSync=String(auto.value).toLowerCase()!=='hayır'&&String(auto.value)!=='0';
      const mins=state.systemParameters.find(x=>x.key==='exchangeUpdateMinutes'); if(mins&&Number(mins.value)>0)state.settings.exchangeUpdateMinutes=Number(mins.value);
      audit('Sistem parametreleri güncellendi','Sistem');save();toast('Sistem parametreleri kaydedildi');render();
    });
  }

  function bindReports(){document.getElementById('exportReport').addEventListener('click',()=>{const rows=[['Tarih','Müşteri','Personel','Toplam','Durum'],...activeSales().map(s=>[trDate(s.date),state.customers.find(c=>c.id===s.customerId)?.name||'',s.salesperson,s.total,s.status])];downloadText(rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n'),`asil_satis_${state.activePeriod}.csv`,'text/csv;charset=utf-8');audit(`${state.activePeriod} satış raporu dışa aktarıldı`,'Rapor');});}

  function bindBackup(){
    document.getElementById('backupDownload').addEventListener('click',()=>{downloadText(JSON.stringify(state,null,2),`ASIL_${state.activePeriod}_${new Date().toISOString().replace(/[:.]/g,'-')}.json`,'application/json');audit('Manuel yedek indirildi','Yedek');});
    document.getElementById('backupFile').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data.meta||!data.users)throw new Error();state=data;save();audit('Yedekten geri yükleme yapıldı','Yedek');toast('Yedek geri yüklendi');render();}catch{toast('Geçersiz yedek dosyası','err')}};reader.readAsText(file);});
    document.getElementById('periodCarry').addEventListener('click',()=>{const next=state.activePeriod+1;if(next>2027)return toast('Demo dönemi sınırı','err');modal('Dönem Devir Simülasyonu',`<p><strong>${state.activePeriod}</strong> kapanış bakiyeleri <strong>${next}</strong> açılışına aktarılacak. Eski hareketler kendi döneminde kalacak.</p><div class="summary-row"><span>Cari sayısı</span><strong>${state.customers.length}</strong></div><div class="summary-row"><span>Aktif stok</span><strong>${activeStock().length}</strong></div><div class="summary-row"><span>HAS cari bakiyesi</span><strong>${qty(state.customers.reduce((a,c)=>a+c.hasBalance,0))} HAS</strong></div>`,()=>{activeStock().forEach(s=>state.stocks.push({...clone(s),id:uid('S'),period:next}));state.activePeriod=next;audit(`${next} dönemi devir simülasyonu oluşturuldu`,'Dönem');closeModal();save();render();});});
  }

  function modal(title,body,onConfirm,confirmText='Kaydet'){
    closeModal(); const el=document.createElement('div'); el.id='modalRoot'; el.className='modal-backdrop'; el.innerHTML=`<div class="modal"><div class="modal-head"><h3>${title}</h3><button class="btn btn-outline" id="modalX">×</button></div><div class="modal-body">${body}</div><div class="modal-actions"><button class="btn btn-outline" id="modalCancel">Vazgeç</button>${onConfirm?`<button class="btn btn-primary" id="modalConfirm">${confirmText}</button>`:''}</div></div>`;document.body.appendChild(el);document.getElementById('modalX').onclick=closeModal;document.getElementById('modalCancel').onclick=closeModal;if(onConfirm)document.getElementById('modalConfirm').onclick=onConfirm;
  }
  function closeModal(){document.getElementById('modalRoot')?.remove();}
  function downloadText(text,name,type){const blob=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}

  if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
  render();
  initLivePriceSync();
})();
